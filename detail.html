<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>友圈 FriendCircle | 活动详情</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body data-page="detail">
    <section class="auth-gate" data-auth-gate>
      <div class="auth-gate__panel">
        <p class="eyebrow">成员进入</p>
        <h2>输入你的专属口令</h2>
        <p class="form-message" data-auth-message>输入后会自动识别你是谁。</p>
        <form data-auth-form>
          <input class="auth-input" type="password" name="passcode" placeholder="专属口令" />
          <button type="submit" class="primary-button">进入友圈</button>
        </form>
      </div>
    </section>

    <main class="page-shell">
      <header class="topbar">
        <p class="eyebrow">活动详情</p>
        <div class="topbar__actions">
          <a class="text-link" href="stats.html">返回统计</a>
          <button class="text-link topbar__logout" type="button" data-logout>退出</button>
        </div>
      </header>

      <section class="hero-card compact">
        <div class="detail-summary">
          <div>
            <p class="eyebrow">活动详情</p>
            <h1 data-render="activity-title">最新活动详情</h1>
            <p data-render="activity-meta">登录后拉取活动详细信息。</p>
          </div>
          <div class="score-icon">胜</div>
        </div>
      </section>

      <div class="page-stack detail-grid">
        <section class="card">
          <div class="section-heading">
            <h2>最终得分</h2>
            <span>本局总结</span>
          </div>
          <div class="detail-score" data-render="scores">
            <div class="detail-score__row detail-score__row--winner">
              <strong>Alex</strong>
              <span class="balance-positive">+$80.00</span>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="section-heading">
            <h2>零食与饮料</h2>
            <span>待同步</span>
          </div>
          <div class="settlements-grid" data-render="settlements">
            <article class="settlement-card">
              <div>
                <h3>刷新后显示</h3>
                <p>这里会展示本场活动的结算数据。</p>
              </div>
              <strong class="balance-positive">$0.00</strong>
            </article>
          </div>
        </section>

        <section class="card">
          <div class="section-heading">
            <h2>精彩瞬间</h2>
            <span>附件与照片</span>
          </div>
          <div class="attachments-grid" data-render="attachments"></div>
        </section>

        <section class="card">
          <div class="section-heading">
            <h2>碎碎念</h2>
            <span>活动留言</span>
          </div>
          <div class="comments-grid" data-render="comments"></div>
          <form class="comment-form" data-comment-form>
            <textarea class="auth-input auth-textarea" name="comment_body" rows="3" placeholder="写点这局的感受"></textarea>
            <p class="form-message" data-comment-message>发表评论后，其他成员刷新即可看到。</p>
            <button type="submit" class="primary-button">发送评论</button>
          </form>
        </section>

        <footer class="page-footer" style="grid-column: 1 / -1;">
          <a href="index.html" class="text-link">首页</a>
          <a href="stats.html" class="text-link">统计</a>
          <a href="record.html" class="text-link">记录</a>
          <a href="detail.html" class="text-link">详情</a>
        </footer>
      </div>
    </main>

    <div id="bottom-nav"></div>
    <script src="assets/js/config.js"></script>
    <script type="module" src="assets/js/site.js"></script>
  </body>
</html>
