<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>友圈 FriendCircle | 活动详情</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body data-page="detail">
    <main class="app-shell app-shell--detail">
      <header class="detail-topbar">
        <a class="icon-button" href="stats.html" aria-label="返回统计">
          <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <h1>活动详情</h1>
        <a class="icon-button" href="record.html" aria-label="新建记录" title="新建记录">
          <span class="material-symbols-outlined">add_circle</span>
        </a>
      </header>

      <section class="detail-hero">
        <div class="detail-icon">
          <span class="material-symbols-outlined">dashboard_customize</span>
        </div>
        <h2 data-render="activity-title">Weekend Mahjong</h2>
        <p data-render="activity-meta">登录后同步活动详情</p>
      </section>

      <section class="card detail-card">
        <div class="card-heading">
          <h2><span class="material-symbols-outlined">leaderboard</span>最终得分</h2>
        </div>
        <div class="score-list" data-render="scores"></div>
      </section>

      <section class="card detail-card">
        <div class="card-heading">
          <h2><span class="material-symbols-outlined">receipt_long</span>零食与饮料</h2>
          <strong class="detail-total">¥54.00</strong>
        </div>
        <div class="settlement-list" data-render="settlements"></div>
      </section>

      <section class="card detail-card">
        <div class="card-heading">
          <h2><span class="material-symbols-outlined">photo_library</span>精彩瞬间</h2>
          <span class="text-button"><span class="material-symbols-outlined">add_a_photo</span>Add</span>
        </div>
        <div class="memory-grid" data-render="attachments"></div>
      </section>

      <section class="card detail-card comments-card">
        <div class="card-heading">
          <h2><span class="material-symbols-outlined">forum</span>碎碎念</h2>
        </div>
        <div class="comment-list" data-render="comments"></div>
        <form class="comment-form" data-comment-form>
          <div class="comment-tools" aria-label="表情和 GIF">
            <button type="button" data-emoji="😄" aria-label="添加笑脸">😄</button>
            <button type="button" data-emoji="🎉" aria-label="添加庆祝">🎉</button>
            <button type="button" data-emoji="🀄" aria-label="添加麻将">🀄</button>
            <label class="gif-field">
              <span class="material-symbols-outlined">gif_box</span>
              <input name="gif_url" type="url" placeholder="GIF 链接" inputmode="url" />
            </label>
          </div>
          <textarea name="comment_body" placeholder="说点什么..." rows="1"></textarea>
          <p class="form-message" data-comment-message>评论会同步给所有成员。</p>
          <button class="send-button" type="submit" aria-label="发送评论">
            <span class="material-symbols-outlined">send</span>
          </button>
        </form>
      </section>
    </main>

    <div id="bottom-nav"></div>
    <script src="assets/js/config.js"></script>
    <script type="module" src="assets/js/site.js"></script>
  </body>
</html>
