<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>友圈 FriendCircle | 首页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body data-page="home">
    <section class="auth-gate" data-auth-gate>
      <div class="auth-gate__panel">
        <div class="brand-lockup">
          <span class="avatar avatar--blue">友</span>
          <span>FriendCircle</span>
        </div>
        <h2>输入你的专属口令</h2>
        <p class="form-message" data-auth-message>输入后会自动识别你是谁。</p>
        <form data-auth-form>
          <input class="auth-input" type="password" name="passcode" placeholder="专属口令" autocomplete="current-password" />
          <button type="submit" class="primary-button block">
            <span class="material-symbols-outlined">login</span>
            进入友圈
          </button>
        </form>
      </div>
    </section>

    <main class="app-shell">
      <header class="app-topbar">
        <a class="brand-lockup" href="index.html" aria-label="FriendCircle 首页">
          <span class="brand-mark">友圈</span>
        </a>
        <button class="icon-button" type="button" data-logout aria-label="退出登录" title="退出登录">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </header>

      <section class="welcome-panel">
        <div>
          <h1>晚上好，<span data-member-name>Alex</span>！</h1>
          <p>准备好周末的游戏了吗？</p>
        </div>
        <a class="primary-button" href="record.html">
          <span class="material-symbols-outlined">add</span>
          新建记录
        </a>
      </section>

      <section class="section-block">
        <div class="section-heading">
          <h2>圈内余额</h2>
          <span>4 人小队</span>
        </div>
        <div class="balance-grid" data-render="members"></div>
      </section>

      <section class="section-block">
        <div class="section-heading">
          <h2>最近活动</h2>
          <a href="detail.html">查看全部</a>
        </div>
        <div class="activity-list" data-render="activities"></div>
      </section>
    </main>

    <div id="bottom-nav"></div>
    <script src="assets/js/config.js"></script>
    <script type="module" src="assets/js/site.js"></script>
  </body>
</html>
