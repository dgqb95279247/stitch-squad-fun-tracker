<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>友圈 FriendCircle | 首页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body data-page="home">
    <section class="auth-gate" data-auth-gate>
      <div class="auth-gate__panel">
        <p class="eyebrow">成员进入</p>
        <h2>输入你的专属口令</h2>
        <p class="form-message" data-auth-message>输入后会自动识别你是谁。</p>
        <form data-auth-form>
          <input class="auth-input" type="password" name="passcode" placeholder="专属口令" />
          <button type="submit" class="primary-button">进入友圈</button>
        </form>
      </div>
    </section>

    <main class="page-shell">
      <header class="topbar">
        <p class="eyebrow">友圈 FriendCircle</p>
        <div class="topbar__actions">
          <a class="text-link" href="stats.html">看统计</a>
          <button class="text-link topbar__logout" type="button" data-logout>退出</button>
        </div>
      </header>

      <section class="hero-card">
        <p class="eyebrow">首页</p>
        <h1>晚上好，<span data-member-name>Alex</span>！</h1>
        <p>准备好周末的游戏局了吗？现在大家的记录、评论和附件都会通过云端 API 保存，刷新后所有成员都能看到最新内容。</p>
        <a class="primary-button" href="record.html">+ 新建记录</a>
      </section>

      <div class="page-stack">
        <section>
          <div class="section-heading">
            <h2>圈内余额</h2>
            <span class="text-link">4 位成员</span>
          </div>
          <div class="members-grid" data-render="members"></div>
        </section>

        <section>
          <div class="section-heading">
            <h2>最近活动</h2>
            <a href="detail.html">查看全部</a>
          </div>
          <div class="activities-grid" data-render="activities"></div>
        </section>

        <footer class="page-footer">
          <a href="index.html" class="text-link">首页</a>
          <a href="stats.html" class="text-link">统计</a>
          <a href="record.html" class="text-link">记录</a>
          <a href="detail.html" class="text-link">详情</a>
        </footer>
      </div>
    </main>

    <div id="bottom-nav"></div>
    <script src="assets/js/config.js"></script>
    <script type="module" src="assets/js/site.js"></script>
  </body>
</html>
