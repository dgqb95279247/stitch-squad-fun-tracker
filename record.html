<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>友圈 FriendCircle | 记录活动</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body data-page="record">
    <main class="app-shell app-shell--narrow">
      <header class="app-topbar">
        <a class="brand-lockup" href="index.html" aria-label="FriendCircle 首页">
          <span class="avatar avatar--blue" data-member-name>A</span>
          <span>FriendCircle</span>
        </a>
        <a class="icon-button" href="detail.html" aria-label="活动详情" title="活动详情">
          <span class="material-symbols-outlined">receipt_long</span>
        </a>
      </header>

      <section class="page-title">
        <h1>记录活动</h1>
        <p>记录一场新的对局或活动</p>
      </section>

      <form class="record-form" data-record-form>
        <input type="hidden" name="activity_type" value="麻将" data-activity-type-input />
        <input type="hidden" name="activity_date" />
        <input type="hidden" name="title" value="周末麻将局" />
        <textarea class="sr-only" name="notes">大家一起玩的开心局。</textarea>

        <section class="form-section">
          <h2>游戏类型</h2>
          <div class="type-strip" data-render="type-options"></div>
        </section>

        <section class="card participants-card">
          <div class="card-heading">
            <h2>参与者（最多4人）</h2>
            <button class="text-button" type="button">编辑</button>
          </div>
          <div class="participant-row" data-render="avatars"></div>
        </section>

        <section class="form-section">
          <label class="field-label" for="location">地点打卡</label>
          <div class="location-field">
            <span class="material-symbols-outlined">location_on</span>
            <input id="location" name="location" type="text" value="Sarah 的公寓" placeholder="添加位置" />
          </div>
        </section>

        <section class="form-section">
          <label class="field-label" for="attachments">精彩瞬间（可选）</label>
          <label class="upload-zone" for="attachments">
            <input id="attachments" type="file" name="attachments" multiple />
            <span class="material-symbols-outlined">add_a_photo</span>
            <strong>添加照片</strong>
          </label>
        </section>

        <p class="form-message" data-record-message>保存后会同步给所有成员。</p>

        <button type="submit" class="primary-button save-button block">
          <span class="material-symbols-outlined">save</span>
          保存记录
        </button>
      </form>
    </main>

    <div id="bottom-nav"></div>
    <script src="assets/js/config.js"></script>
    <script type="module" src="assets/js/site.js"></script>
  </body>
</html>
