<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>友圈 FriendCircle | 记录活动</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body data-page="record">
    <section class="auth-gate" data-auth-gate>
      <div class="auth-gate__panel">
        <p class="eyebrow">成员进入</p>
        <h2>输入你的专属口令</h2>
        <p class="form-message" data-auth-message>输入后会自动识别你是谁。</p>
        <form data-auth-form>
          <input class="auth-input" type="password" name="passcode" placeholder="专属口令" />
          <button type="submit" class="primary-button">进入友圈</button>
        </form>
      </div>
    </section>

    <main class="page-shell">
      <header class="topbar">
        <p class="eyebrow">记录页</p>
        <a class="text-link" href="index.html">回到首页</a>
      </header>

      <section class="hero-card compact">
        <p class="eyebrow">记录活动</p>
        <h1>记录一场新的对局或活动</h1>
        <p>这次提交会直接写入 D1，上传的照片和文件会进入 R2，其他成员刷新后即可看到。</p>
      </section>

      <form class="page-stack record-grid" data-record-form>
        <section class="card">
          <div class="section-heading">
            <h2>游戏类型</h2>
            <span>选择今晚主题</span>
          </div>
          <div class="record-field">
            <label class="field-label" for="activity_type">游戏类型</label>
            <select id="activity_type" name="activity_type" class="auth-input"></select>
          </div>
          <div class="record-field">
            <label class="field-label" for="title">活动标题</label>
            <input id="title" class="auth-input" type="text" name="title" value="周末麻将局" />
          </div>
          <div class="record-field">
            <label class="field-label" for="activity_date">活动日期</label>
            <input id="activity_date" class="auth-input" type="date" name="activity_date" />
          </div>
        </section>

        <section class="record-panel">
          <h3>参与者</h3>
          <div class="avatar-row" data-render="avatars"></div>
          <p style="margin-top: 14px;">当前版本固定为 4 人小圈子，所有成员都会自动加入活动。</p>
        </section>

        <section class="record-panel">
          <h3>地点打卡</h3>
          <div class="record-field">
            <label class="field-label" for="location">地点打卡</label>
            <input id="location" class="auth-input" type="text" name="location" value="上海市静安区 Sarah 家" />
          </div>
          <div class="record-field">
            <label class="field-label" for="notes">备注</label>
            <textarea id="notes" class="auth-input auth-textarea" name="notes" rows="4">带上零食和充电器。</textarea>
          </div>
        </section>

        <section class="record-panel">
          <h3>精彩瞬间</h3>
          <div class="upload-panel">
            <div>
              <h3>添加照片和附件</h3>
              <p>支持上传照片、清单截图或其他活动文件。</p>
              <input class="auth-input" type="file" name="attachments" multiple />
            </div>
          </div>
        </section>

        <p class="form-message" data-record-message>保存后会同步到 API，其他成员刷新后即可看到。</p>

        <button type="submit" class="primary-button block">保存记录</button>

        <footer class="page-footer" style="grid-column: 1 / -1;">
          <a href="index.html" class="text-link">首页</a>
          <a href="stats.html" class="text-link">统计</a>
          <a href="record.html" class="text-link">记录</a>
          <a href="detail.html" class="text-link">详情</a>
        </footer>
      </form>
    </main>

    <div id="bottom-nav"></div>
    <script src="assets/js/config.js"></script>
    <script type="module" src="assets/js/site.js"></script>
  </body>
</html>
