<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>友圈 FriendCircle | 统计</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body data-page="stats">
    <section class="auth-gate" data-auth-gate>
      <div class="auth-gate__panel">
        <p class="eyebrow">成员进入</p>
        <h2>输入你的专属口令</h2>
        <p class="form-message" data-auth-message>输入后会自动识别你是谁。</p>
        <form data-auth-form>
          <input class="auth-input" type="password" name="passcode" placeholder="专属口令" />
          <button type="submit" class="primary-button">进入友圈</button>
        </form>
      </div>
    </section>

    <main class="page-shell">
      <header class="topbar">
        <p class="eyebrow">统计页</p>
        <div class="topbar__actions">
          <a class="text-link" href="index.html">返回首页</a>
          <button class="text-link topbar__logout" type="button" data-logout>退出</button>
        </div>
      </header>

      <section class="hero-card compact">
        <p class="eyebrow">统计</p>
        <h1>排行榜</h1>
        <p>看看本月谁在称霸友圈，所有活动统计都会从 Cloudflare Worker API 拉取。</p>
      </section>

      <div class="page-stack stats-grid">
        <section class="card">
          <div class="section-heading">
            <h2>胜率对比</h2>
            <span data-render="stats-summary">等待同步</span>
          </div>
          <div class="bars-grid" data-render="bars"></div>
        </section>

        <section class="card">
          <div class="section-heading">
            <h2>当前排名</h2>
            <span>本月表现</span>
          </div>
          <ol class="leaderboard-list" data-render="leaderboard"></ol>
        </section>

        <section class="card" style="grid-column: 1 / -1;">
          <div class="section-heading">
            <h2>资金流向</h2>
            <a href="detail.html">结算清单</a>
          </div>
          <div class="settlements-grid" data-render="settlements"></div>
        </section>

        <footer class="page-footer" style="grid-column: 1 / -1;">
          <a href="index.html" class="text-link">首页</a>
          <a href="stats.html" class="text-link">统计</a>
          <a href="record.html" class="text-link">记录</a>
          <a href="detail.html" class="text-link">详情</a>
        </footer>
      </div>
    </main>

    <div id="bottom-nav"></div>
    <script src="assets/js/config.js"></script>
    <script type="module" src="assets/js/site.js"></script>
  </body>
</html>
