<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>友圈 FriendCircle | 统计</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body data-page="stats">
    <main class="app-shell app-shell--stats">
      <header class="app-topbar">
        <a class="brand-lockup" href="index.html" aria-label="FriendCircle 首页">
          <span class="avatar avatar--blue" data-member-name>A</span>
          <span>FriendCircle</span>
        </a>
        <a class="icon-button" href="detail.html" aria-label="活动详情" title="活动详情">
          <span class="material-symbols-outlined">receipt_long</span>
        </a>
      </header>

      <section class="page-title">
        <h1>排行榜</h1>
        <p>看看本月谁在称霸友圈</p>
        <p class="stats-summary-inline" data-render="stats-summary">等待同步</p>
      </section>

      <div class="segmented-control" aria-label="统计指标">
        <button class="is-active" type="button">胜率</button>
        <button type="button">总胜场</button>
        <button type="button">净收益</button>
      </div>

      <div class="stats-grid">
        <section class="card chart-card">
          <div class="card-heading">
            <h2>胜率对比</h2>
            <span class="status-pill"><i></i>所有游戏</span>
          </div>
          <div class="bar-chart" data-render="bars"></div>
        </section>

        <section class="rank-panel">
          <h2><span class="material-symbols-outlined">trophy</span>当前排名</h2>
          <ol class="rank-list" data-render="leaderboard"></ol>
        </section>

        <section class="card flow-card">
          <div class="card-heading">
            <div>
              <h2><span class="material-symbols-outlined accent-orange">account_balance_wallet</span>资金流向</h2>
              <p>基于近期分摊的欠款情况</p>
            </div>
            <a href="detail.html">结算清账</a>
          </div>
          <div class="settlement-list" data-render="settlements"></div>
        </section>
      </div>
    </main>

    <div id="bottom-nav"></div>
    <script src="assets/js/config.js"></script>
    <script type="module" src="assets/js/site.js"></script>
  </body>
</html>
